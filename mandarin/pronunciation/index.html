<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandarin · Hear and record</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#1f2937}
*{box-sizing:border-box}body{max-width:680px;margin:0 auto;padding:12px 12px 32px}
a{color:#1565ce}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.panel{border:1px solid #dbe3ed;border-radius:16px;background:white;padding:12px;margin-top:10px}
.picker{display:flex;gap:8px;align-items:center}.picker label{font-size:14px;font-weight:700;white-space:nowrap}
select{padding:9px;min-width:0;width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.word{text-align:center;font-size:clamp(82px,21vw,124px);line-height:1.24;font-family:"Noto Serif SC","Songti SC",serif}
.py{text-align:center;font-size:27px;font-weight:700}.meaning{text-align:center;color:#667085;font-size:15px}
.soundRow{display:flex;align-items:center;gap:8px;margin:8px 0}.soundRow button{flex:0 0 auto}
button{min-height:44px;border:1px solid #b8c9dc;background:white;color:#172b46;border-radius:11px;padding:9px 11px;font-size:15px;font-weight:650}
button.primary{background:#1668d5;border-color:#1668d5;color:white}button.recording{background:#b91c1c;border-color:#b91c1c;color:white}
button:disabled{opacity:.48}
canvas{display:block;flex:1;min-width:0;width:100%;height:62px;border:1px solid #e5ebf1;border-radius:10px;background:#f4f8fc}
.small{font-size:12px;color:#667085;line-height:1.45;min-height:18px}
h1{font-size:18px;margin:2px 0}.heading{font-size:14px;font-weight:750;margin:0 0 4px}
.legend{font-size:12px;color:#526071}
@media(max-width:350px){button{font-size:13px;padding:8px}.word{font-size:80px}}
</style></head><body>
<header><a href="../">← Mandarin app</a><span class="legend">Hear · Record · Compare</span></header>
<main class="panel">
<div class="picker"><label for="word">Vocabulary</label><select id="word" aria-label="Choose vocabulary"></select></div>
<div id="glyph" class="word" lang="zh">书</div><div id="pinyin" class="py">shū</div><div id="meaning" class="meaning">book</div>
<div class="heading">Dictionary pronunciation</div>
<div class="soundRow"><button id="playRef" class="primary" disabled>▶ Hear it</button><canvas id="refWave" aria-label="Dictionary recording waveform"></canvas></div>
<div id="refStatus" class="small" role="status">Loading saved dictionary audio…</div>
<div class="heading" style="margin-top:14px">Your pronunciation</div>
<div class="soundRow"><button id="record">● Record</button><button id="playMine" disabled>▶ Mine</button><canvas id="mineWave" aria-label="Your microphone waveform"></canvas></div>
<div id="mineStatus" class="small" role="status">Record a short example; it stays only in this browser tab.</div>
<div class="small" style="margin-top:8px">Compare both sounds and waveform shapes. Waveform height shows loudness, not Mandarin tone.</div>
</main>
<script>
"use strict";
const API="https://dbqrenlvinqheyjppxby.supabase.co/functions/v1/mandarin-dictionary-audio";
const $=id=>document.getElementById(id);
let context,reference=null,mine=null,recorder=null,stream=null,chunks=[],generation=0;
const audioCtx=()=>context||(context=new (window.AudioContext||window.webkitAudioContext)());
function getEntries(){
try{const saved=JSON.parse(localStorage.getItem("mandarinAppV2")||"null");
if(saved&&Array.isArray(saved.entries))return saved.entries.filter(x=>x.simplified&&x.pinyin).map(x=>({text:x.simplified,pinyin:x.pinyin,meaning:x.meaning||""}));}catch(e){}
return [{text:"书",pinyin:"shū",meaning:"book"}];
}
const entries=getEntries();
const params=new URLSearchParams(location.search),requested=params.get("word")||"书";
if(!entries.some(x=>x.text===requested))entries.unshift({text:requested,pinyin:"",meaning:""});
const select=$("word");
entries.forEach((e,i)=>{const option=document.createElement("option");option.value=String(i);option.textContent=e.text+" · "+e.pinyin;select.append(option)});
select.value=String(Math.max(0,entries.findIndex(x=>x.text===requested)));
function draw(canvas,buffer,color){
const ratio=window.devicePixelRatio||1,w=canvas.width=Math.max(1,Math.round(canvas.clientWidth*ratio)),h=canvas.height=Math.round(62*ratio),ctx=canvas.getContext("2d");
ctx.clearRect(0,0,w,h);ctx.strokeStyle="#d2dbe6";ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
if(!buffer)return;
const data=buffer.getChannelData(0),stride=Math.max(1,Math.ceil(data.length/w));ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,ratio);ctx.beginPath();
for(let x=0;x<w;x++){let peak=0;const start=x*stride;for(let j=start;j<Math.min(data.length,start+stride);j++)peak=Math.max(peak,Math.abs(data[j]));const size=peak*h*.44;ctx.moveTo(x,h/2-size);ctx.lineTo(x,h/2+size)}
ctx.stroke();
}
function render(){draw($("refWave"),reference,"#15958c");draw($("mineWave"),mine,"#266dda")}
async function decode(blob){return audioCtx().decodeAudioData(await blob.arrayBuffer())}
async function loadReference(){
const current=++generation,chosen=entries[Number(select.value)],text=chosen.text;
$("glyph").textContent=text;$("pinyin").textContent=chosen.pinyin||"";
$("meaning").textContent=chosen.meaning||"";reference=null;mine=null;render();
$("playRef").disabled=true;$("playMine").disabled=true;
$("mineStatus").textContent="Record a short example; it stays only in this browser tab.";
$("refStatus").textContent="Loading saved dictionary audio…";
const u=new URL(location.href);u.searchParams.set("word",text);history.replaceState(null,"",u);
try{
const response=await fetch(API+"?text="+encodeURIComponent(text));
if(!response.ok)throw Error("Dictionary lookup unavailable ("+response.status+")");
const item=await response.json();
if(current!==generation)return;
if(item.pinyin)$("pinyin").textContent=item.pinyin;
if(!item.audio_url){$("refStatus").textContent="No saved dictionary recording for this entry yet.";return;}
const audio=await fetch(item.audio_url);
if(!audio.ok)throw Error("Audio download failed ("+audio.status+")");
const buffer=await decode(await audio.blob());
if(current!==generation)return;
reference=buffer;$("playRef").disabled=false;
$("refStatus").textContent="Saved recording ready · "+buffer.duration.toFixed(1)+" seconds.";
render();
}catch(error){if(current===generation)$("refStatus").textContent="Could not load saved audio: "+error.message}
}
async function play(buffer){if(!buffer)return;const c=audioCtx();await c.resume();const source=c.createBufferSource();source.buffer=buffer;source.connect(c.destination);source.start();}
$("playRef").onclick=()=>play(reference);$("playMine").onclick=()=>play(mine);
function stopRecording(){if(recorder&&recorder.state==="recording")recorder.stop()}
$("record").onclick=async()=>{
if(recorder&&recorder.state==="recording"){stopRecording();return;}
if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$("mineStatus").textContent="Microphone recording is not supported here. Open in Chrome over HTTPS.";return;}
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];
const local=new MediaRecorder(stream);recorder=local;
$("record").textContent="■ Stop";$("record").classList.add("recording");$("mineStatus").textContent="Recording…";
local.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
local.onstop=async()=>{
stream?.getTracks().forEach(t=>t.stop());stream=null;
$("record").textContent="● Record";$("record").classList.remove("recording");
try{mine=await decode(new Blob(chunks,{type:local.mimeType}));$("playMine").disabled=false;$("mineStatus").textContent="Your recording is ready · "+mine.duration.toFixed(1)+" seconds. Tap Mine to listen.";render()}
catch(e){$("mineStatus").textContent="Could not read this recording. Try Chrome.";}
chunks=[];recorder=null;
};
local.start();
}catch(error){$("record").textContent="● Record";$("record").classList.remove("recording");$("mineStatus").textContent="Microphone permission is needed: "+error.message;}
};
select.onchange=()=>{stopRecording();loadReference()};
window.addEventListener("resize",render);
window.addEventListener("pagehide",()=>{stopRecording();stream?.getTracks().forEach(t=>t.stop());});
render();loadReference();
</script></body></html>
