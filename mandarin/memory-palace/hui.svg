<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<rect width="900" height="1200" rx="36" fill="#fffaf0"/>
<rect x="36" y="36" width="828" height="150" rx="28" fill="#f7e7b4"/>
<text x="70" y="105" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#111">Memory Palace — 会</text>
<text x="70" y="155" font-family="Arial,sans-serif" font-size="30" fill="#444">huì · houéï · can / know how to</text>
<rect x="36" y="215" width="828" height="220" rx="28" fill="#eaf3ff"/>
<text x="68" y="270" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#163b75">REAL ORIGIN</text>
<text x="68" y="325" font-family="Arial,sans-serif" font-size="30" fill="#222">Older form: 會</text>
<text x="68" y="372" font-family="Arial,sans-serif" font-size="27" fill="#333">Core idea: people gathering / meeting together.</text>
<text x="68" y="414" font-family="Arial,sans-serif" font-size="27" fill="#333">From “gather” came “know how to / can.”</text>
<rect x="36" y="465" width="828" height="400" rx="28" fill="#fff3d6"/>
<text x="450" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#7a4b00">MEETING ROOM</text>
<ellipse cx="450" cy="720" rx="210" ry="80" fill="#c98d4d"/>
<circle cx="300" cy="610" r="48" fill="#ffd7b0"/><circle cx="450" cy="585" r="48" fill="#ffd7b0"/><circle cx="600" cy="610" r="48" fill="#ffd7b0"/>
<path d="M300 658 L300 710 M450 633 L450 705 M600 658 L600 710" stroke="#555" stroke-width="18" stroke-linecap="round"/>
<text x="450" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="140" font-weight="700" fill="#111">会</text>
<text x="450" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#333">Everyone gathers around the person who KNOWS HOW.</text>
<rect x="36" y="895" width="828" height="245" rx="28" fill="#eef8e9"/>
<text x="68" y="950" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#235c20">MEMORY HOOK</text>
<text x="68" y="1005" font-family="Arial,sans-serif" font-size="29" fill="#222">gather together → knowledge / ability → CAN</text>
<text x="68" y="1060" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111">我会说中文。</text>
<text x="68" y="1108" font-family="Arial,sans-serif" font-size="27" fill="#333">I can speak Chinese.</text>
</svg>