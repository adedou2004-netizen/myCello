<html lang="en">
<head>

<title>Mandarin</title>
<style>
:root{--blue:#1473e6;--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--bg:#f6f7fb}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 10px}
h1{margin:0;font-size:22px} .sub{color:var(--muted);font-size:13px;margin-top:2px}
main{padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.glyph{font-size:clamp(84px,28vw,128px);line-height:1;text-align:center;font-family:"Songti SC","Noto Serif SC",serif}
.trad{text-align:center;color:var(--muted);font-size:18px;margin-top:4px}
.py{text-align:center;font-size:28px;font-weight:750;margin-top:6px}
.fr{text-align:center;color:var(--blue);font-weight:700;margin-top:2px}
.mean{text-align:center;font-size:18px;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.center{justify-content:center}
button,input,select,textarea{font:inherit}
button{min-height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
button.on{background:#eef6ff;color:var(--blue);border-color:#bfdbfe}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;min-height:52px;font-size:11px;font-weight:700;color:#475467}
nav button[aria-selected="true"]{color:var(--blue);background:#eef6ff}
.hidden{display:none!important}
.due{font-size:42px;font-weight:800;color:var(--blue);line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fafafa}
.stat b{display:block;font-size:28px;color:var(--blue);line-height:1.1;margin-top:2px}
.calendar{margin-top:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calday,.caldow{min-height:54px;border:1px solid var(--line);border-radius:10px;padding:5px;text-align:center;background:#fff}
.caldow{min-height:auto;border:0;background:transparent;font-size:11px;color:var(--muted);font-weight:700}
.calday.empty{border-color:transparent;background:transparent}
.calday.today{border-color:var(--blue);background:#eef6ff}
.calnum{font-size:12px;color:var(--muted)}
.calcount{font-size:17px;font-weight:800;color:var(--blue);margin-top:3px}
@media(max-width:420px){.calday{min-height:48px;padding:4px}.calcount{font-size:15px}}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:42px;font-size:20px}
.ex{border-top:1px solid var(--line);padding:8px 0}
.ex b{font-size:20px}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,560px);box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0008}
.dlghead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlgbody{padding:12px}
.dlgbody img{width:100%;border-radius:12px;max-height:62vh;object-fit:contain;background:#fffaf0}
.muted{color:var(--muted);font-size:13px}
.listbtn{width:100%;text-align:left;margin-bottom:8px}
.progress{height:8px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--blue)}
.finder{position:relative;border-radius:16px;overflow:hidden;background:#111;min-height:210px}
.finder video,.finder img{width:100%;height:220px;object-fit:cover;display:block;background:#111}
.box{position:absolute;left:50%;top:50%;width:68%;height:46%;transform:translate(-50%,-50%);border:4px solid #16e016;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.kicker{font-size:12px;letter-spacing:.04em;color:#98a2b3;font-weight:700;margin:12px 0 6px}
.phrase{width:100%;font-size:28px;color:var(--blue);background:#eef6ff;border-color:#dbeafe}
.note{display:flex;gap:8px;align-items:center}
.camfull{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
.camfull video{flex:1;width:100%;object-fit:cover}
.camfull .box{height:28%}
.cambar{display:flex;gap:10px;justify-content:center;align-items:center;padding:14px;background:#111}
#writer{width:min(82vw,320px);height:min(82vw,320px);margin:12px auto;border:2px solid #d0d5dd;border-radius:12px;background:#fff}
</style>

    cells.push(`<div class="calday ${isToday?"today":""}"><div class="calnum">${d}</div><div class="calcount">${count||""}</div></div>`);
  }
  host.innerHTML=`<div class="calhead"><button id="calPrev" type="button">←</button><strong>${base.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</strong><button id="calNext" type="button">→</button></div><div class="calgrid">${names.map(x=>`<div class="caldow">${x}</div>`).join("")}${cells.join("")}</div><p class="muted">A number on a day is how many items are due that day. Overdue and never-reviewed items are counted today.</p>`;
  $("#calPrev").onclick=()=>{calendarMonthOffset--;renderDueCalendar()};
  $("#calNext").onclick=()=>{calendarMonthOffset++;renderDueCalendar()};
}
function grade(id,good){
  const r=db.reviews[id]||{strength:2.5,interval:0,streak:0};
  r.streak=good?r.streak+1:0;
  if(!good){r.interval=1;r.strength=Math.max(1.3,r.strength-.2);r.next=Date.now()+86400000}
  else if(r.streak<3){r.interval=0;r.next=Date.now()+600000}
  else {r.interval=Math.max(1,Math.round((r.interval||1)*r.strength));r.next=Date.now()+r.interval*86400000}
  db.reviews[id]=r; const e=entry(id); if(e) e.status=r.streak>=3?"review":"learning"; save();
}
function examplesFor(id){return db.examples.filter(x=>x.entryId===id)}
function palaceFor(e){return db.palace[e.id]||null}
function speak(text){const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}
function card(e, actions){
  const trad=e.traditional&&e.traditional!==e.simplified?`<div class="trad">Traditional ${e.traditional}</div>`:"";
  const ex=examplesFor(e.id);
  return `<div class="card"><div class="glyph">${e.simplified}</div>${trad}<div class="py">${e.pinyin||""}</div><div class="fr">Fr-En sound · ${displaySound(e)}</div><div class="mean hidden" id="englishAnswer">${e.meaning||"No English yet"}</div><div class="row center"><button data-act="english">Show English</button><button class="primary" data-act="palace">Palace</button><button data-act="examples">Examples${ex.length?" · "+ex.length:""}</button><button data-act="hear">Hear</button></div>${actions||""}<div id="hint"></div></div>`;
}
function showHint(kind){
  const e=currentEntry(); if(!e) return;
  const box=$("#hint");
  if(kind==="examples"){
    const ex=examplesFor(e.id);
    box.innerHTML=ex.length?ex.map(x=>`<div class="ex"><b>${x.surface}</b><div>${x.meaning||""}</div><div class="muted">${x.source||""}</div></div>`).join(""):"<p class='muted'>No example yet. Capture one and attach it to this character.</p>";
  }
  if(kind==="palace") openPalace(e);
}
function currentEntry(){return study?entry(study):null}
function renderToday(){
  const due=syncReviewOrder();
  study=reviewOrder[0]||null;
  const e=study?entry(study):null;
  $("#app").innerHTML=`<div class="card"><div class="muted">Due today</div><div class="due">${due.length}</div><div class="row" style="margin-top:10px"><button id="shuffleReview" type="button" ${due.length<2?"disabled":""}>Shuffle</button><button id="toggleCalendar" type="button" style="flex:1">View month</button></div><div id="dueCalendar" class="calendar hidden"></div></div>`+(e?card(e,`<div class="row center" style="margin-top:10px"><button data-act="again">Again</button><button class="primary" data-act="good">Knew it</button></div><p class="muted">${reviewOrder.length} remaining in review</p>`):`<div class="card">Nothing due. Practice a lesson, or capture a new word.</div>`);
  $("#shuffleReview").onclick=shuffleReview;
  $("#toggleCalendar").onclick=()=>{const cal=$("#dueCalendar");cal.classList.toggle("hidden");$("#toggleCalendar").textContent=cal.classList.contains("hidden")?"View month":"Hide month";if(!cal.classList.contains("hidden")) renderDueCalendar()};
  bindCard();
}
function renderLessons(){
  $("#app").innerHTML=`<div class="card"><button class="primary" id="newLesson" type="button">New lesson from a book or class</button><p class="muted">A lesson is a list. The character stays once in the dictionary.</p></div>`+db.lessons.map(l=>`<button class="listbtn card" data-lesson="${l.id}"><strong>${l.title}</strong><div class="muted">${l.kind} · ${l.items.length} items</div><div class="progress"><span style="width:${Math.round(100*l.items.filter(id=>db.reviews[id]&&db.reviews[id].streak>=3).length/Math.max(1,l.items.length))}%"></span></div></button>`).join("");
  $("#newLesson").onclick=()=>{const title=prompt("Lesson name, for example The Little Prince, chapter 2"); if(!title) return; db.lessons.unshift({id:"u"+Date.now(),title,kind:"book",source:title,items:[]}); save(); renderLessons()};
  document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
}
function openLesson(id){
  const l=db.lessons.find(x=>x.id===id); if(!l) return;
  lessonQueue=l.items.slice(); lessonAt=0; tab="lesson";
  $("#title").textContent=l.title; $("#subtitle").textContent="Practice this lesson. Due date is ignored.";
  showLesson();
}
function showLesson(){
  const id=lessonQueue[lessonAt]; const e=id?entry(id):null;
  if(!e){$("#app").innerHTML=`<div class="card">Lesson finished.</div><button id="backLessons" class="primary">Back to lessons</button>`; $("#backLessons").onclick=()=>select("lessons"); return}
  $("#app").innerHTML=card(e,`<div class="row center" style="margin-top:10px"><button data-act="again">Again</button><button class="primary" data-act="next">Next</button></div><p class="muted">${lessonAt+1} of ${lessonQueue.length}</p>`);
  bindCard();
}
function renderCapture(){
  $("#app").innerHTML=`<div id="savedBanner" class="card hidden"></div><div class="card"><div class="finder" id="finder"><video id="cam" autoplay playsinline muted></video><div class="box"></div></div><p class="muted" id="camHint">Point the Chinese at the green box, then take the picture.</p><button class="primary" id="openCam" type="button">Take picture</button><input id="photoFile" type="file" accept="image/*" capture="environment" hidden><div class="kicker">DETECTED CHARACTERS</div><div class="chips" id="charChips"></div><div class="kicker">DETECTED PHRASE</div><button class="phrase" id="phraseChip" type="button">Tap a picture first</button><div class="row" style="margin-top:8px"><button class="primary" id="saveChar" type="button">Save character</button><button class="primary" id="saveExpr" type="button">Save expression</button></div><label>Sentence you met</label><input id="capNote" placeholder="I love to play pingpong with my friends"><label>Add to lesson</label><div class="row"><select id="capLesson" style="flex:1">${db.lessons.map(l=>`<option value="${l.id}">${l.title}</option>`).join("")}</select><button id="newLessonCap" type="button">New lesson</button></div><p id="capStatus" class="muted"></p></div>`;
  $("#openCam").onclick=openCamera;
  $("#photoFile").onchange=()=>readPhoto($("#photoFile").files[0]);
  $("#saveChar").onclick=()=>savePicked("character");
  $("#saveExpr").onclick=()=>savePicked("expression");
  $("#newLessonCap").onclick=newLessonFromCapture;
  startPreview();
}
function newLessonFromCapture(){
  const title=prompt("Name the lesson, for example Pingpong with friends");
  if(!title) return;
  const id="u"+Date.now();
  db.lessons.unshift({id,title,kind:"book",source:title,items:[]});
  save();
  const sel=$("#capLesson");
  const opt=document.createElement("option");
  opt.value=id; opt.textContent=title; sel.prepend(opt); sel.value=id;
  $("#capStatus").textContent="Lesson created: "+title+". Save the word into it.";
}
let camStream=null, picked="";
async function startPreview(){
  const video=$("#cam"); if(!video||!navigator.mediaDevices) return;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); video.srcObject=camStream;}
  catch(e){$("#camHint").textContent="Camera did not open. Take picture will ask for a photo instead.";}
}
function stopPreview(){ if(camStream){camStream.getTracks().forEach(t=>t.stop()); camStream=null;} }
async function openCamera(){
  if(!camStream){$("#photoFile").click(); return;}
  const video=$("#cam"), canvas=document.createElement("canvas");
  const vr=video.getBoundingClientRect();
  canvas.width=video.videoWidth||1080; canvas.height=video.videoHeight||1440;
  canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);
  const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",.92));
  readPhoto(blob);
}
async function readPhoto(file){
  if(!file) return;
  $("#camHint").textContent="Reading the green box…";
  try{
    const result=await Tesseract.recognize(file,"chi_sim+eng");
    const runs=(result.data.text.match(/[\u3400-\u9fff]+/g)||[]);
    const chars=[...new Set(runs.join("").split(""))].slice(0,12);
    const phrase=runs.join("")||"";
    $("#charChips").innerHTML=chars.map(ch=>`<button class="chip" data-pick="${ch}">${ch}</button>`).join("")||"<span class='muted'>No characters found. Try closer.</span>";
    $("#phraseChip").textContent=phrase||"No phrase found";
    picked=phrase||chars[0]||"";
    document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{picked=b.dataset.pick; document.querySelectorAll("[data-pick]").forEach(x=>x.classList.remove("on")); b.classList.add("on");});
    $("#phraseChip").onclick=()=>{picked=phrase};
    $("#camHint").textContent="Tap the character or phrase, then save.";
  }catch(e){$("#camHint").textContent="Could not read that photo. Try again with the text filling the green box.";}
}
function savePicked(kind){
  const text=(picked||$("#phraseChip").textContent||"").trim();
  if(!text||text.startsWith("Tap")||text.startsWith("No ")){$("#capStatus").textContent="Choose a character or phrase first."; return;}
  const value=kind==="character"?[...text][0]:text;
  const lesson=$("#capLesson").value;
  const note=$("#capNote").value.trim();
  let target=byText(value);
  const already=!!target;
  if(!target){
    target={id:"u"+Date.now(),simplified:value,traditional:"",pinyin:"",sound:"",meaning:note,type:kind==="expression"?"expression":"character",status:"new",source:"photo"};
    db.entries.unshift(target);
  } else if(note && !target.meaning) target.meaning=note;
  const l=db.lessons.find(x=>x.id===lesson);
  if(l&&!l.items.includes(target.id)) l.items.push(target.id);
  if(note || value) db.examples.unshift({id:"e"+Date.now(),entryId:target.id,surface:value,meaning:note,source:l?l.title:""});
  save();
  const where=l?l.title:"the dictionary";
  const msg=(already?"Already in the dictionary. ":"Saved. ")+value+" is in "+where+".";
  $("#capStatus").textContent=msg;
  const banner=$("#savedBanner");
  banner.classList.remove("hidden");
  banner.innerHTML="<strong>Saved</strong><div>"+msg+"</div><button id='seeSaved' type='button'>Open it</button>";
  $("#seeSaved").onclick=()=>{study=target.id; select("today");};
  banner.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderLibrary(){
  const q=($("#libQ")&&$("#libQ").value||"").toLowerCase();
  $("#app").innerHTML=`<input id="libQ" placeholder="Search the dictionary" value="${q}"><div style="height:8px"></div>`+db.entries.filter(e=>(e.simplified+e.pinyin+e.meaning).toLowerCase().includes(q)).slice(0,40).map(e=>`<button class="listbtn card" data-open="${e.id}"><strong style="font-size:28px">${e.simplified}</strong> ${e.traditional&&e.traditional!==e.simplified?e.traditional:""}<div class="muted">${e.pinyin} · ${french(e.pinyin)} · ${e.meaning}</div></button>`).join("")+`<p class="muted">${db.entries.length} in the dictionary. No duplicates.</p>`;
  $("#libQ").oninput=renderLibrary;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{study=b.dataset.open; select("today")});
}
let quizMode="listen";
function renderQuiz(){
  const pool=db.entries.filter(e=>e.pinyin&&[...e.simplified].length===1);
  const target=pool[Math.floor(Math.random()*pool.length)];
  quiz=target.id;
  const modes=`<div class="row" style="margin-bottom:10px"><button data-mode="listen" class="${quizMode==="listen"?"on":""}">Hear</button><button data-mode="speak" class="${quizMode==="speak"?"on":""}">Speak</button><button data-mode="draw" class="${quizMode==="draw"?"on":""}">Draw</button></div>`;
  if(quizMode==="speak"){
    $("#app").innerHTML=`<div class="card">${modes}<div class="glyph">${target.simplified}</div><div class="py">${target.pinyin}</div><div class="fr">Fr-En sound · ${french(target.pinyin)}</div><button class="primary" id="speakCheck">Say it</button><p id="quizMsg" class="muted">Tap Say it, then speak the character.</p><button id="nextQuiz" type="button">Next</button></div>`;
    $("#speakCheck").onclick=()=>checkSpeech(target);
  } else if(quizMode==="draw"){
    $("#app").innerHTML=`<div class="card">${modes}<div class="py">${target.pinyin}</div><div class="fr">Fr-En sound · ${french(target.pinyin)}</div><button data-act="english" id="showEn" type="button">Show English</button><div id="englishAnswer" class="mean hidden">${target.meaning}</div><div id="writer"></div><div class="row center"><button id="watch" type="button">Watch</button><button id="nextQuiz" type="button">Next</button></div><p id="quizMsg" class="muted">Draw the character.</p></div>`;
    $("#showEn").onclick=()=>{$("#englishAnswer").classList.toggle("hidden")};
    try{
      const writer=HanziWriter.create("writer",target.simplified,{width:300,height:300,padding:12,showOutline:true,showCharacter:false});
      writer.quiz({onComplete:()=>{$("#quizMsg").textContent="Correct stroke order."; grade(target.id,true)}});
      $("#watch").onclick=()=>{writer.cancelQuiz(); writer.animateCharacter({onComplete:()=>writer.quiz()})};
    }catch(e){$("#quizMsg").textContent="Drawing data is not available for "+target.simplified;}
  } else {
    const opts=[target].concat(pool.filter(e=>e.id!==target.id).sort(()=>Math.random()-.5).slice(0,3)).sort(()=>Math.random()-.5);
    $("#app").innerHTML=`<div class="card">${modes}<div class="muted">Listening quiz</div><button class="primary" id="play">Hear the word</button><div class="chips" style="margin-top:12px">${opts.map(e=>`<button class="chip" data-choice="${e.id}">${e.simplified}<div class="muted">${e.pinyin}</div></button>`).join("")}</div><p id="quizMsg" class="muted"></p><button id="nextQuiz" type="button">Next</button></div>`;
    $("#play").onclick=()=>speak(target.simplified);
    document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{const ok=b.dataset.choice===quiz; $("#quizMsg").textContent=ok?"Correct.":"Not this one. The word was "+target.simplified+" "+target.pinyin; grade(target.id,ok)});
  }
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{quizMode=b.dataset.mode; renderQuiz()});
  const next=$("#nextQuiz"); if(next) next.onclick=renderQuiz;
}
function checkSpeech(target){
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){$("#quizMsg").textContent="This phone cannot check speech in the browser. Use Chrome."; return;}
  const rec=new Rec(); rec.lang="zh-CN"; rec.interimResults=false; rec.maxAlternatives=3;
  $("#quizMsg").textContent="Listening…";
  rec.onresult=ev=>{
    const heard=[...ev.results[0]].map(x=>x.transcript).join(" ");
    const ok=heard.includes(target.simplified);
    $("#quizMsg").textContent=ok?"Correct. You said "+heard:"Heard "+heard+". The character is "+target.simplified+".";
    grade(target.id,ok);
  };
  rec.onerror=()=>{$("#quizMsg").textContent="I could not hear you. Tap Say it and try again."};
  rec.start();
}
function bindCard(){
  const e=currentEntry()||entry(lessonQueue[lessonAt]); if(!e) return;
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const act=b.dataset.act;
    if(act==="hear") speak(e.simplified);
    if(act==="english"){const a=$("#englishAnswer"); a.classList.toggle("hidden"); b.textContent=a.classList.contains("hidden")?"Show English":"Hide English";}
    if(act==="examples"||act==="palace") showHint(act);
    if(act==="again"||act==="good"){grade(e.id,act==="good"); reviewOrder=reviewOrder.filter(id=>id!==e.id); study=null; renderToday()}
    if(act==="next"){grade(e.id,true); lessonAt++; showLesson()}
  });
}
function openPalace(e){
  const p=palaceFor(e)||{};
  $("#palaceTitle").textContent="Palace · "+e.simplified;
  $("#palaceImg").src=p.url||"memory-palace/hui.svg";
  $("#palaceNote").textContent=p.story||"One picture for this character only.";
  $("#palaceStory").value=p.story||"";
  $("#palaceStatus").textContent="";
  $("#palaceDlg").showModal();
  $("#palaceSave").onclick=async()=>{
    const file=$("#palaceFile").files[0];
    let url=p.url||"";
    if(file){
      const path=e.simplified+"-"+Date.now()+".jpg";
      try{
        const r=await fetch(SUPABASE_URL+"/storage/v1/object/memory-palace-cards/"+encodeURIComponent(path),{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"content-type":file.type||"image/jpeg","x-upsert":"true"},body:file});
        if(r.ok) url=BUCKET+encodeURIComponent(path);
      }catch(err){}
      if(!url) url=await new Promise(res=>{const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(file)});
    }
    db.palace[e.id]={url,story:$("#palaceStory").value.trim(),storagePath:url};
    save();
    try{await fetch(SUPABASE_URL+"/rest/v1/memory_palace_cards",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"content-type":"application/json",prefer:"resolution=merge-duplicates"},body:JSON.stringify({subject_type:e.type,subject_text:e.simplified,storage_path:url.replace(BUCKET,""),title:"Palace · "+e.simplified,note:$("#palaceStory").value.trim()})})}catch(err){}
    $("#palaceStatus").textContent="Saved on this character.";
    $("#palaceImg").src=url||$("#palaceImg").src;
  };
}
$("#palaceClose").onclick=()=>$("#palaceDlg").close();
async function loadRemotePalace(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/memory_palace_cards?select=subject_text,storage_path,title,note",{headers:{apikey:SUPABASE_KEY}});
    if(!r.ok) return;
    const rows=await r.json();
    rows.forEach(row=>{const e=byText(row.subject_text); if(!e) return; const path=row.storage_path||""; db.palace[e.id]=db.palace[e.id]||{url:path.startsWith("http")?path:BUCKET+path,story:row.note||"",storagePath:path}});
    save(); if(tab==="today") renderToday();
  }catch(e){}
}
function select(which){
  tab=which;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===which)));
  const titles={today:["Today","Due cards. Palace and examples stay on the character."],lessons:["Lessons","Course lists and book lists. Tap one to practice it."],capture:["Capture","Save once, then link it to a lesson."],library:["Library","The dictionary. Each character exists once."],quiz:["Quiz","Hear it, then match the character."]};
  $("#title").textContent=titles[which][0]; $("#subtitle").textContent=titles[which][1];
  if(which!=="capture") stopPreview();
  if(which==="today") renderToday();
  if(which==="lessons") renderLessons();
  if(which==="capture") renderCapture();
  if(which==="library") renderLibrary();
  if(which==="quiz") renderQuiz();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>select(b.dataset.tab));
select("today"); loadRemotePalace();
</script>
</body>
