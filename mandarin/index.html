<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mandarin</title>
<style>
:root{--green:#58CC02;--green-d:#46A302;--ink:#3C3C3C;--muted:#777;--line:#E5E5E5;--bg:#F7F7F7;--blue:#1CB0F6}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Nunito","Avenir Next",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#fff;padding:10px 16px 8px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;text-align:center}
.sub{color:var(--muted);font-size:12px;text-align:center;margin-top:1px}
.sessionbar{height:14px;background:#E5E5E5;border-radius:99px;overflow:hidden;margin:8px 0 0}
.sessionbar span{display:block;height:100%;background:var(--green);border-radius:99px}
main{padding:12px 14px}
.card{background:#fff;border:2px solid #E5E5E5;border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 2px 0 #E5E5E5}
.glyph{font-size:clamp(96px,32vw,140px);line-height:1;text-align:center;font-family:"Noto Serif SC","Songti SC",serif;font-weight:600}
.trad{text-align:center;color:var(--muted);font-size:16px;margin-top:2px}
.py{text-align:center;font-size:32px;font-weight:800;margin-top:4px}
.fr{text-align:center;color:var(--blue);font-weight:800;margin-top:2px;font-size:15px}
.mean{text-align:center;font-size:20px;font-weight:800;margin:8px 0;color:#58A700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.center{justify-content:center}
button,input,select,textarea{font:inherit}
button{min-height:48px;border:2px solid #E5E5E5;background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 #E5E5E5}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #E5E5E5}
button.primary{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d)}
button.on{background:#DDF4FF;color:var(--blue);border-color:#84D8FF}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#fff;border-top:2px solid #E5E5E5;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;box-shadow:none;min-height:56px;font-size:11px;font-weight:800;color:#AFAFAF;border-radius:12px;padding:4px}
nav button[aria-selected="true"]{color:var(--green);background:#F0FFE6}
.hidden{display:none!important}
.due{font-size:40px;font-weight:800;color:var(--green);line-height:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.stat{border:2px solid #E5E5E5;border-radius:16px;padding:10px;background:#fff}
.stat b{display:block;font-size:28px;color:var(--green);line-height:1.1;margin-top:2px}
.calendar{margin-top:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calday,.caldow{min-height:54px;border:2px solid #E5E5E5;border-radius:12px;padding:5px;text-align:center;background:#fff}
.caldow{min-height:auto;border:0;background:transparent;font-size:11px;color:var(--muted);font-weight:800}
.calday.empty{border-color:transparent;background:transparent}
.calday.today{border-color:var(--green);background:#F0FFE6}
.calnum{font-size:12px;color:var(--muted)}
.calcount{font-size:17px;font-weight:800;color:var(--green);margin-top:3px}
@media(max-width:420px){.calday{min-height:48px;padding:4px}.calcount{font-size:15px}}
label{display:block;font-size:13px;color:var(--muted);font-weight:800;margin:10px 0 4px}
input,select,textarea{width:100%;border:2px solid #E5E5E5;border-radius:14px;padding:12px;background:#fff;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:56px;font-size:22px;font-weight:800}
.ex{border-top:2px solid #E5E5E5;padding:8px 0}
.ex b{font-size:20px}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,560px);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
.dlghead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:2px solid #E5E5E5}
.dlgbody{padding:14px}
.dlgbody img{width:100%;border-radius:14px;max-height:62vh;object-fit:contain;background:#fffaf0}
.muted{color:var(--muted);font-size:13px;font-weight:700}
.listbtn{width:100%;text-align:left;margin-bottom:0}
.progress{height:12px;background:#E5E5E5;border-radius:99px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--green)}
.finder{position:relative;border-radius:16px;overflow:hidden;background:#111;min-height:210px}
.finder video,.finder img{width:100%;height:220px;object-fit:cover;display:block;background:#111}
.box{position:absolute;left:50%;top:50%;width:68%;height:46%;transform:translate(-50%,-50%);border:4px solid #58CC02;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.kicker{font-size:12px;letter-spacing:.06em;color:#AFAFAF;font-weight:800;margin:12px 0 6px}
.phrase{width:100%;font-size:28px;color:var(--blue);background:#E6F7FF;border-color:#84D8FF}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tools button{min-height:44px;font-size:13px;padding:8px}
.answer{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.answer button{min-height:54px;font-size:16px}
.note{display:flex;gap:8px;align-items:center}
.camfull{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
.camfull video{flex:1;width:100%;object-fit:cover}
.camfull .box{height:28%}
.cambar{display:flex;gap:10px;justify-content:center;align-items:center;padding:14px;background:#111}
#writer{width:min(82vw,320px);height:min(82vw,320px);margin:12px auto;border:2px solid #E5E5E5;border-radius:16px;background:#fff}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<header><h1 id="title">Today</h1><div class="sub" id="subtitle">Keep the streak. One character at a time.</div><div class="sessionbar"><span id="sessionFill" style="width:0%"></span></div></header>
<main id="app"></main>
<nav>
<button data-tab="today" aria-selected="true">Today</button>
<button data-tab="lessons">Lessons</button>
<button data-tab="capture">Capture</button>
<button data-tab="library">Library</button>
<button data-tab="quiz">Quiz</button>
</nav>
<dialog id="memoryAidDlg"><div class="dlghead"><strong id="memoryAidTitle">Memory Aid</strong><button id="memoryAidClose" type="button">Close</button></div><div class="dlgbody"><img id="memoryAidImg" alt="App-provided character memory aid" class="hidden"><p id="memoryAidNote"></p><p id="memoryAidStatus" class="muted"></p></div></dialog>

<dialog id="palacePromptDlg" aria-labelledby="palacePromptTitle"><div class="dlghead"><strong id="palacePromptTitle">Create a Memory Palace card</strong><button id="palacePromptClose" type="button">Close</button></div><div class="dlgbody"><p>Copy this into ChatGPT</p><div id="palacePromptWord" class="glyph"></div><label for="palacePromptText">Word and SkillMD instructions</label><textarea id="palacePromptText" readonly rows="12" style="font-size:16px;font-weight:400"></textarea><button id="palacePromptCopy" class="primary" type="button">Copy this into ChatGPT</button><p id="palacePromptStatus" role="status" aria-live="polite"></p></div></dialog>

    $("#referenceSpeech").onclick=()=>speak(target.simplified);
  } else if(quizMode==="draw"){
    $("#app").innerHTML=`<div class="card">${modes}<div class="py">${target.pinyin}</div><div class="fr">Fr-En sound · ${french(target.pinyin)}</div><button data-act="english" id="showEn" type="button">Show English</button><div id="englishAnswer" class="mean hidden">${target.meaning}</div><div id="writer"></div><div class="row center"><button id="watch" type="button">Watch</button><button id="nextQuiz" type="button">Next</button></div><p id="quizMsg" class="muted">Draw the character.</p></div>`;
    $("#showEn").onclick=()=>{$("#englishAnswer").classList.toggle("hidden")};
    try{
      const writer=HanziWriter.create("writer",target.simplified,{width:300,height:300,padding:12,showOutline:true,showCharacter:false});
      writer.quiz({onComplete:()=>{$("#quizMsg").textContent="Correct stroke order."; grade(target.id,true)}});
      $("#watch").onclick=()=>{writer.cancelQuiz(); writer.animateCharacter({onComplete:()=>writer.quiz()})};
    }catch(e){$("#quizMsg").textContent="Drawing data is not available for "+target.simplified;}
  } else {
    const opts=[target].concat(pool.filter(e=>e.id!==target.id).sort(()=>Math.random()-.5).slice(0,3)).sort(()=>Math.random()-.5);
    $("#app").innerHTML=`<div class="card">${modes}<div class="muted">Listening quiz</div><button class="primary" id="play">Hear the word</button><div class="chips" style="margin-top:12px">${opts.map(e=>`<button class="chip" data-choice="${e.id}">${e.simplified}<div class="muted">${e.pinyin}</div></button>`).join("")}</div><p id="quizMsg" class="muted"></p><button id="nextQuiz" type="button">Next</button></div>`;
    $("#play").onclick=()=>speak(target.simplified);
    document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{const ok=b.dataset.choice===quiz; $("#quizMsg").textContent=ok?"Correct.":"Not this one. The word was "+target.simplified+" "+target.pinyin; grade(target.id,ok)});
  }
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{quizMode=b.dataset.mode; renderQuiz()});
  const next=$("#nextQuiz"); if(next) next.onclick=renderQuiz;
}
function bindCard(){
  const e=currentEntry()||entry(lessonQueue[lessonAt]); if(!e) return;
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const act=b.dataset.act;
    if(act==="hear") speak(e.simplified);
    if(act==="compare") location.href="./pronunciation/?word="+encodeURIComponent(e.simplified);
    if(act==="english"){const a=$("#englishAnswer"); a.classList.toggle("hidden"); b.textContent=a.classList.contains("hidden")?"Show English":"Hide English";}
    if(act==="examples"||act==="memoryAid"||act==="myPalace") showHint(act,e);
    if(act==="again"||act==="good"){grade(e.id,act==="good"); reviewOrder=reviewOrder.filter(id=>id!==e.id); study=null; renderToday()}
    if(act==="next"){grade(e.id,true); lessonAt++; showLesson()}
  });
}
const MEMORY_AIDS={
  "天":{file:"mem_sky_heaven.png",note:"Above a big person (大) is the sky: the line above the head helps you remember 天."},
  "见":{file:"mem_see_meet.png",note:"An eye on legs goes out to meet someone. The old form evokes an eye above a person: to see or meet."},
  "读":{file:"mem_read.png",note:"Speech or words on the left (讠), selling on the right (卖). If you sell me the words, I can read them."}
};
const memoryAidImageUrls={};
async function loadMemoryAidImage(file){
  if(memoryAidImageUrls[file]) return memoryAidImageUrls[file];
  const response=await fetch(SUPABASE_URL+"/storage/v1/object/authenticated/mandarin-assets/"+encodeURIComponent(file),{
    headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}
  });
  if(!response.ok) throw new Error("Supabase image request failed ("+response.status+")");
  const blob=await response.blob();
  if(!blob.type.startsWith("image/")) throw new Error("Storage did not return an image");
  return memoryAidImageUrls[file]=URL.createObjectURL(blob);
}
async function openMemoryAid(e){
  await remotePalaceReady;
  const shared=remotePalaceCards[e.simplified];
  const asset=MEMORY_AIDS[e.simplified];
  const title="Memory Aid · "+e.simplified;
  $("#memoryAidTitle").textContent=title;
  $("#memoryAidImg").classList.add("hidden");
  $("#memoryAidImg").removeAttribute("src");
  $("#memoryAidNote").textContent=asset?asset.note:"An app-provided mnemonic image is not available for this character yet.";
  $("#memoryAidStatus").textContent=asset?"Loading image…":"";
  $("#memoryAidDlg").showModal();
  if(shared?.url){
    $("#memoryAidImg").src=shared.url;
    $("#memoryAidImg").classList.remove("hidden");
    $("#memoryAidNote").textContent=shared.note||"Saved Memory Palace card.";
    $("#memoryAidStatus").textContent="";
    return;
  }
  if(asset) loadMemoryAidImage(asset.file).then(url=>{
    if(!$("#memoryAidDlg").open || $("#memoryAidTitle").textContent!==title) return;
    $("#memoryAidImg").src=url;
    $("#memoryAidImg").classList.remove("hidden");
    $("#memoryAidStatus").textContent="";
  }).catch(err=>{
    if($("#memoryAidTitle").textContent===title) $("#memoryAidStatus").textContent="Could not load the image: "+err.message;
  });
}
$("#memoryAidClose").onclick=()=>$("#memoryAidDlg").close();

const PALACE_IMAGE_SKILL="---\nname: mandarin-character-image-prompt\ndescription: Reuse or create Mandarin Memory Palace learning cards with large characters, pinyin, meanings and accurate component explanations; save new approved cards in Supabase mandarin-assets and register their links for later vocabulary review.\n---\n\n# Create or reuse a Memory Palace card\n\n## Inputs and destination\nAccept the selected Mandarin character or word, pinyin and intended meaning. Verify missing readings. Default to simplified Chinese, retaining a distinct traditional form when useful.\n\nUse the existing myCello project:\n- App: https://adedou2004-netizen.github.io/myCello/mandarin/\n- Supabase project: dbqrenlvinqheyjppxby\n- Image bucket: mandarin-assets (private; do not change bucket visibility).\n- Shared card index: public.memory_palace_cards.\n- Vocabulary: public.mandarin_entries; mnemonic_image_path stores the bucket-relative image filename.\nNever embed secrets in this file or public app code.\n\n## 1. Look up before generating\nNormalize surrounding whitespace and Unicode NFC. Match subject_type (character or expression), subject_text and the intended reading/meaning. Inspect the actual schema before querying or updating; use the connected Supabase tools.\n\nCheck the shared card index and the matching vocabulary entry for an existing image link/path. Verify that the linked object exists and loads. A stroke-animation URI such as mycello-stroke:// is not an image card.\n\nIf a matching usable card exists, DO NOT generate or upload another image. Return only a clickable link labelled with the word and pinyin. Reuse its stored canonical object path. For a private object, obtain an authorized signed display URL; do not pretend that a public-bucket URL works.\n\nThis lookup applies when a word is SHOWN AGAIN FOR REVIEW to check whether the learner knows it. It does not require creating the word again. The app should offer the saved card link in its Memory Palace/help area, without revealing the answer before the learner chooses help.\n\nDo not interpret an unavailable database or permission error as proof that no card exists.\n\n## 2. Analyze a genuinely missing card\nIdentify the real components and their layout; distinguish semantic and phonetic components. Verify uncertain origin claims using authoritative references, or explicitly label the story \"Mnemonic only.\" Never invent component meanings or present a mnemonic as real etymology.\n\nFor a simple character such as 一, explain the single stroke rather than inventing component addition. For compound words, explain each character briefly and illustrate the word as one scene.\n\n## 3. Generate the actual learning card\nUse the available image-generation tool, not merely a written prompt. Match the warm cream storybook style of the existing cards, with bold outlines, uncluttered composition and a clear memorable scene.\n\nThe card MUST contain:\n- A VERY LARGE, correctly written Mandarin character or word.\n- Official pinyin with tone marks.\n- English meaning and a brief French equivalent when available.\n- A readable component explanation using large Chinese components, pinyin and their meanings.\n- A short sentence connecting the illustration to the meaning.\n\nExample: 人 rén → 亻 (person) + 木 mù (tree / wood) = 休 xiū (to rest). A person rests against a tree.\nExample: 一 yī (one / un): one horizontal stroke represents one.\n\nInclude the requested writing. Do not use wordless-image rules or negative prompts that exclude Chinese characters, pinyin or explanatory text. Avoid unrelated writing, watermarks, logos and visual clutter.\n\nInspect the generated card for glyph, tone-mark, spelling and explanation accuracy; correct material errors before saving.\n\n## 4. Save and register\nUse the established Supabase skill and supported Storage API. Upload the actual image bytes to mandarin-assets.\n\nUse this required filename format: `english_translation_pinyin.png`.\n- Start with the English translation of the selected character or expression.\n- Add one underscore, then its pinyin without tone marks or tone numbers.\n- Use lowercase; replace spaces within each part with hyphens so the underscore clearly separates English from pinyin.\n- Strip tone diacritics; represent ü as v for an ASCII-safe filename.\n- Examples: 休 xiū (rest) → `rest_xiu.png`; 一 yī (one) → `one_yi.png`; 你好 nǐ hǎo (hello) → `hello_ni-hao.png`.\n- Use the selected meaning, not an entire semicolon-separated dictionary definition.\n- Reuse an existing matching object. For a genuinely different card with a filename collision, preserve this base and append a version suffix, e.g. `rest_xiu-v2.png`; do not overwrite without authorization.\nNever create only a database row or storage.objects metadata without uploading the bytes.\n\nUse authorized credentials or the established upload flow. Do not make the bucket public, grant broad anonymous writes, or bypass access controls. If upload access is unavailable, retain the image, report the missing access and do not claim it was saved.\n\nBefore writing, repeat the duplicate lookup in case another session has added a card. Do not replace an existing approved card without an explicit replacement request.\n\nAfter a successful upload:\n1. Store the canonical bucket-relative object path in the matching mandarin_entries.mnemonic_image_path; preserve the entry's words, reviews and unrelated fields.\n2. Insert the shared memory_palace_cards record with subject_type, normalized subject_text, title, explanatory note and a usable card link in storage_path according to the existing app contract. Record the canonical mandarin-assets path in the note if that field currently holds a display URL.\n3. Because mandarin-assets is private, use authenticated loading or signed URLs. Signed URLs expire: retain the canonical path so a fresh display URL can be obtained. Do not present expiring URLs as permanent identifiers.\n4. If a unique-key conflict occurs, reread and reuse the existing matching card instead of overwriting it.\n5. Read back the stored mapping and verify a download returns a valid image.\n\nIf the image has uploaded but registration fails, report the partial result and repair the mapping before generating another image.\n\n## 5. App behavior on later review\nLoad the shared word-to-card index when the app starts and refresh it when checking for a missing card. Resolve each displayed word against that index, independently of its spaced-repetition history.\n\nIf a saved card exists, show a \"View Memory Palace card\" link and open that card when requested; do not show the creation popup. A newly registered shared card must also work when a local personal Memory Palace record exists without a picture.\n\nKeep personal image choices and memory stories local and preferred over shared defaults. Never overwrite a person's chosen photo or automatically submit it to the shared collection.\n\nOnly when neither a usable personal picture nor a shared card exists, offer a popup saying \"Copy this into ChatGPT.\" Put the selected word, pinyin and meaning BEFORE these full instructions. This copied request must include this Supabase lookup/upload/registration workflow.\n\n## Completion\nFor an existing card, return its verified clickable link only.\nFor a new card, finish the upload and registration, then return its verified clickable link with a short saved confirmation. If any step fails, state what remains incomplete.\n";
const remotePalaceCards={};
let remotePalaceReady=Promise.resolve();
function palaceCardSource(e){
  const p=palaceFor(e)||{};
  return p.url||p.storagePath||remotePalaceCards[e.simplified]?.url||MEMORY_AIDS[e.simplified]?.file||"";
}
function palaceImagePrompt(e){
  return "Word: "+e.simplified+"\nPinyin: "+(e.pinyin||"Please verify")+"\nMeaning: "+(e.meaning||"Please verify")+"\n\n"+
    "Create one Memory Palace learning card for this word. IMPORTANT: include a VERY LARGE Mandarin character, official pinyin with tone marks, meaning, and a clear component explanation with large Mandarin component characters and their pinyin/meanings (for example: 人 rén → 亻, person + 木 mù, tree/wood = 休 xiū, to rest). Distinguish real origins from invented mnemonics. This explicit request OVERRIDES every wordless/no-writing instruction in the SkillMD below. Generate the image, not only a prompt.\n\n"+
    PALACE_IMAGE_SKILL+"\n\nComplete the Supabase lookup first. Reuse an existing card link; otherwise create, upload to mandarin-assets, register the link and verify it.";
}
function openPalacePrompt(e){
  $("#palacePromptWord").textContent=e.simplified;
  $("#palacePromptText").value=palaceImagePrompt(e);
  $("#palacePromptStatus").textContent="";
  if(!$("#palacePromptDlg").open) $("#palacePromptDlg").showModal();
}
$("#palacePromptClose").onclick=()=>$("#palacePromptDlg").close();
$("#palacePromptCopy").onclick=async()=>{
  const field=$("#palacePromptText");
  try{
    await navigator.clipboard.writeText(field.value);
    $("#palacePromptStatus").textContent="Copied. Paste this into ChatGPT.";
  }catch(error){
    field.focus();field.select();field.setSelectionRange(0,field.value.length);
    $("#palacePromptStatus").textContent="Press and hold the selected text to copy, or use Ctrl+C.";
  }
};
$("#palaceGenerate").onclick=()=>{const e=entry(activePalaceEntry);if(e)openPalacePrompt(e)};

let activePalaceEntry=null;
function linkedPalaceEntries(name){
  const target=name.trim().toLowerCase();
  if(!target) return [];
  return db.entries.filter(item=>(db.palace[item.id]?.palaceName||"").trim().toLowerCase()===target);
}
function renderPalaceLinks(e){
  const name=$("#palaceName").value.trim();
  const others=linkedPalaceEntries(name).filter(item=>item.id!==e.id);
  $("#palaceLinked").innerHTML=name&&others.length
    ?'<p class="muted">Other characters in this Memory Palace:</p>'+others.map(item=>
      '<button type="button" data-palace-entry="'+item.id+'">'+item.simplified+' — '+(db.palace[item.id]?.location||"Location not set")+'</button>'
    ).join(" ")
    :"";
  document.querySelectorAll("[data-palace-entry]").forEach(button=>button.onclick=()=>{
    const other=entry(button.dataset.palaceEntry);
    if(other) openPalace(other);
  });
}

async function openMemoryPalaceCard(e){
  activePalaceEntry=e.id;
  await remotePalaceReady;
  if(activePalaceEntry!==e.id) return;
  let personal=palaceFor(e)||{};
  if(!personal.url && !remotePalaceCards[e.simplified]?.url && !MEMORY_AIDS[e.simplified]){
    await loadRemotePalace();
    if(activePalaceEntry!==e.id) return;
    personal=palaceFor(e)||{};
  }
  const shared=remotePalaceCards[e.simplified];
  const asset=MEMORY_AIDS[e.simplified];
  const source=personal.url||shared?.url;
  if(!source && !asset){
    if($("#palaceDlg").open) $("#palaceDlg").close();
    openPalacePrompt(e);
    return;
  }
  const title="Memory Palace · "+e.simplified;
  $("#memoryAidTitle").textContent=title;
  $("#memoryAidImg").classList.add("hidden");
  $("#memoryAidImg").removeAttribute("src");
  $("#memoryAidNote").textContent=personal.story||shared?.note||asset?.note||"";
  $("#memoryAidStatus").textContent="Loading image…";
  if($("#palaceDlg").open) $("#palaceDlg").close();
  if(!$("#memoryAidDlg").open) $("#memoryAidDlg").showModal();
  try{
    const url=source||await loadMemoryAidImage(asset.file);
    if(!$("#memoryAidDlg").open || $("#memoryAidTitle").textContent!==title) return;
    $("#memoryAidImg").onerror=()=>{$("#memoryAidStatus").textContent="Could not load the saved image. Check your connection and try again.";};
    $("#memoryAidImg").onload=()=>{$("#memoryAidStatus").textContent="";};
    $("#memoryAidImg").src=url;
    $("#memoryAidImg").classList.remove("hidden");
  }catch(error){
    if($("#memoryAidTitle").textContent===title) $("#memoryAidStatus").textContent="Could not load the saved image: "+error.message;
  }
}

async function openPalace(e,offerPrompt=true){
  activePalaceEntry=e.id;
  await remotePalaceReady;
  if(activePalaceEntry!==e.id) return;
  const p={...(palaceFor(e)||{})};
  if(!p.url && remotePalaceCards[e.simplified]?.url) p.url=remotePalaceCards[e.simplified].url;
  $("#palaceTitle").textContent="My Memory Palace · "+e.simplified;
  const hasPersonalMemory=!!(p.palaceName||p.location||p.story||p.url);
  $("#palaceIntro").textContent=hasPersonalMemory
    ?"Your personal memory location for this character. You can connect other characters by using the same Memory Palace name."
    :"Create My First Memory Palace: give your Memory Palace a name, choose a location for this character, and optionally add your own picture.";
  $("#palaceName").value=p.palaceName||"";
  $("#palaceLocation").value=p.location||"";
  $("#palaceImg").classList.toggle("hidden",!p.url);
  if(p.url) $("#palaceImg").src=p.url; else $("#palaceImg").removeAttribute("src");
  $("#palaceNote").textContent=p.location?"Location: "+p.location:"";
  $("#palaceStory").value=p.story||"";
  $("#palaceFile").value="";
  $("#palaceStatus").textContent="";
  $("#palaceSave").textContent=hasPersonalMemory?"Save My Memory Palace":"Create My First Memory Palace";
  renderPalaceLinks(e);
  if(!palaceCardSource(e) && offerPrompt){
    await loadRemotePalace();
    if(activePalaceEntry!==e.id || !$("#palaceDlg").open && $("#palaceTitle").textContent!=="My Memory Palace · "+e.simplified) return;
    const shared=remotePalaceCards[e.simplified];
    if(!p.url && shared?.url){$("#palaceImg").src=shared.url;$("#palaceImg").classList.remove("hidden");}
  }
  const sharedLink=remotePalaceCards[e.simplified]?.url||"";
  const link=$("#palaceCardLink");
  link.classList.toggle("hidden",!/^https?:\/\//.test(sharedLink));
  if(/^https?:\/\//.test(sharedLink)) link.href=sharedLink; else link.removeAttribute("href");
  const missing=!palaceCardSource(e);
  $("#palaceGenerate").classList.toggle("hidden",!missing);
  if(!$("#palaceDlg").open) $("#palaceDlg").showModal();
  if(missing&&offerPrompt) openPalacePrompt(e);
}
$("#palaceName").oninput=()=>{
  const e=entry(activePalaceEntry);
  if(e) renderPalaceLinks(e);
};
$("#palaceClose").onclick=()=>$("#palaceDlg").close();
$("#palaceSave").onclick=async()=>{
  const e=entry(activePalaceEntry);
  if(!e) return;
  const name=$("#palaceName").value.trim(),location=$("#palaceLocation").value.trim();
  if(!name||!location){
    $("#palaceStatus").textContent="Give your Memory Palace a name and this character a location.";
    return;
  }
  const p=palaceFor(e)||{};
  const file=$("#palaceFile").files[0];
  let url=p.url||"";
  if(file){
    const path=e.simplified+"-"+Date.now()+".jpg";
    try{
      const response=await fetch(SUPABASE_URL+"/storage/v1/object/memory-palace-cards/"+encodeURIComponent(path),{
        method:"POST",
        headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"content-type":file.type||"image/jpeg","x-upsert":"true"},
        body:file
      });
      if(response.ok) url=BUCKET+encodeURIComponent(path);
    }catch(err){}
    if(!url) url=await new Promise(resolve=>{
      const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file);
    });
  }
  const story=$("#palaceStory").value.trim();
  db.palace[e.id]={...p,palaceName:name,location,story,url,storagePath:url};
  save();
  $("#palaceStatus").textContent="Saved in this browser. Your character is linked to "+name+" at "+location+".";
  await openPalace(e,false);
  $("#palaceStatus").textContent="Saved in this browser. Your character is linked to "+name+" at "+location+".";
};
async function loadRemotePalace(){
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/memory_palace_cards?select=subject_text,storage_path,title,note",{headers:{apikey:SUPABASE_KEY}});
    if(!r.ok) return;
    const rows=await r.json();
    rows.forEach(row=>{const path=row.storage_path||""; if(path) remotePalaceCards[row.subject_text]={url:path.startsWith("http")?path:BUCKET+path,note:row.note||""};});
    rows.forEach(row=>{const e=byText(row.subject_text); if(!e) return; const path=row.storage_path||""; db.palace[e.id]=db.palace[e.id]||{url:path.startsWith("http")?path:BUCKET+path,story:row.note||"",storagePath:path}});
    save(); if(tab==="today") renderToday();
  }catch(e){}
}
function select(which){
  stopSpeechListening();
  tab=which;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===which)));
  const titles={today:["Today","Due cards with Memory Aid, My Memory Palace and examples."],lessons:["Lessons","Course lists and book lists. Tap one to practice it."],capture:["Capture","Save once, then link it to a lesson."],library:["Library","The dictionary. Each character exists once."],quiz:["Quiz","Hear it, then match the character."]};
  $("#title").textContent=titles[which][0]; $("#subtitle").textContent=titles[which][1];
  if(which!=="capture") stopPreview();
  if(which==="today") renderToday();
  if(which==="lessons") renderLessons();
  if(which==="capture") renderCapture();
  if(which==="library") renderLibrary();
  if(which==="quiz") renderQuiz();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>select(b.dataset.tab));
select("today"); remotePalaceReady=loadRemotePalace();
</script>
