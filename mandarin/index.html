<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandarin Learning</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#111827}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;flex-direction:column}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#f2f4f7;border-bottom:1px solid #e4e7ec;position:sticky;top:0;z-index:10}
button{min-height:48px;border:1px solid #d0d5dd;border-radius:13px;background:#fff;color:#111827;font:600 15px/1.1 system-ui;padding:8px;cursor:pointer}
button[aria-selected="true"]{background:#111827;color:#fff;border-color:#111827}
#memoryBar{display:none;padding:7px 10px;background:#fff7ed;border-bottom:1px solid #fed7aa;text-align:center}
#photoBar{padding:7px 10px;background:#eef6ff;border-bottom:1px solid #bfdbfe;text-align:center}
#photoStatus{margin-left:8px;font-size:13px;color:#475467}
#memoryBtn{min-height:40px;background:#fff;border-color:#fdba74;font-size:14px}
iframe{border:0;width:100%;flex:1;min-height:calc(100vh - 66px);background:#fff}
dialog{border:0;border-radius:18px;padding:0;max-width:min(94vw,720px);width:720px;box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0009}
.memoryHead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.memoryHead strong{font-size:22px}.close{min-height:38px;padding:6px 10px}
.memoryBody{padding:12px;text-align:center}.memoryBody img{display:block;max-width:100%;max-height:72vh;margin:auto;border-radius:12px}.memoryNote{margin-top:9px;color:#667085}
@media(max-width:520px){button{font-size:12px;padding:7px 3px}nav{gap:4px;padding:6px}.memoryHead strong{font-size:18px}}
</style>
</head>
<body>
<nav role="tablist" aria-label="Mandarin learning sections">
<button id="learn" role="tab" aria-selected="true">✍ Characters</button>
<button id="radicals" role="tab" aria-selected="false">部 Radicals</button>
<button id="expressions" role="tab" aria-selected="false">💬 Expressions</button>
<button id="games" role="tab" aria-selected="false">🎮 Games</button>
</nav>
<div id="photoBar"><button id="photoBtn" type="button">📷 Add from photo</button><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><span id="photoStatus"></span></div>
<div id="memoryBar"><button id="memoryBtn">🧠 Memory Palace</button></div>
<iframe id="app" title="Mandarin learning app" src="../index.html"></iframe>
<dialog id="memoryDialog">
 <div class="memoryHead"><strong id="memoryTitle">Memory Palace</strong><button id="memoryClose" class="close">✕</button></div>
 <div class="memoryBody"><img id="memoryImage" alt="Memory palace card"><div id="memoryNote" class="memoryNote"></div></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPABASE_URL="https://dbqrenlvinqheyjppxby.supabase.co";
const SUPABASE_KEY="sb_publishable__twdY8fk0pZo7dU-BNDwWg_0-JQ1BjJ";
const STORAGE_BASE=SUPABASE_URL+"/storage/v1/object/public/memory-palace-cards/";
const frame=document.getElementById("app");
const buttons=[...document.querySelectorAll("nav button")];
const memoryBar=document.getElementById("memoryBar");
const memoryBtn=document.getElementById("memoryBtn");
const memoryDialog=document.getElementById("memoryDialog");
const photoBtn=document.getElementById("photoBtn"),photoInput=document.getElementById("photoInput"),photoStatus=document.getElementById("photoStatus");
let mode="learn", cards=new Map(), currentCard=null, lastSubject="";

photoBtn.onclick=()=>photoInput.click();
photoInput.onchange=async()=>{
 const file=photoInput.files&&photoInput.files[0];if(!file)return;
 photoStatus.textContent="Reading photo…";
 try{
  const result=await Tesseract.recognize(file,"chi_sim+eng");
  const raw=(result.data.text||"").trim();
  const chinese=(raw.match(/[\u3400-\u9fff]+/g)||[]).join("");
  if(!chinese){photoStatus.textContent="I could not find Chinese text. You can still type it manually.";return}
  const text=chinese.slice(0,20);
  if(mode==="learn"&&[...text].length===1){
   const doc=frame.contentDocument,input=doc&&doc.getElementById("newCharacter");
   if(input){input.value=text;input.dispatchEvent(new Event("input",{bubbles:true}));input.scrollIntoView({behavior:"smooth",block:"center"});photoStatus.textContent="Found "+text+" — check it, then add it.";return}
  }
  if(mode!=="expressions"){select("expressions");await new Promise(r=>setTimeout(r,700))}
  const doc=frame.contentDocument;
  const candidates=["newExpression","addWord","word","expression","newWord"].map(id=>doc&&doc.getElementById(id)).filter(Boolean);
  if(candidates[0]){candidates[0].value=text;candidates[0].dispatchEvent(new Event("input",{bubbles:true}));candidates[0].scrollIntoView({behavior:"smooth",block:"center"});photoStatus.textContent="Found "+text+" — check it before saving."}
  else {photoStatus.textContent="Found: "+text+". Copy it into the expression form."}
 }catch(e){console.warn(e);photoStatus.textContent="Photo reading failed. Please try a clearer picture."}
 finally{photoInput.value=""}
};
async function loadCards(){
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/memory_palace_cards?select=subject_type,subject_text,storage_path,title,note",{headers:{apikey:SUPABASE_KEY}});
  if(!r.ok) throw new Error("Unable to load cards");
  const rows=await r.json();
  cards=new Map(rows.map(x=>[x.subject_type+"|"+x.subject_text,x]));
  updateMemoryButton();
 }catch(e){console.warn(e)}
}
function pageFor(which){
 if(which==="expressions")return "../expressions/";
 if(which==="radicals")return "../radicals-60/";
 return "../index.html";
}
function select(which){
 mode=which;
 buttons.forEach(b=>b.setAttribute("aria-selected",String(b.id===which)));
 const wanted=pageFor(which);
 const current=new URL(frame.src,location.href);
 const target=new URL(wanted,location.href);
 if(current.pathname!==target.pathname) frame.src=wanted;
 else if(which==="learn"||which==="games") activateMain(which);
 memoryBar.style.display="none";
 setTimeout(updateMemoryButton,100);
}
function cleanOldExpressionCards(doc){
 ["old-expressions-heading","lesson-expressions-heading"].forEach(id=>{const h=doc.getElementById(id);if(h&&h.parentElement)h.parentElement.style.display="none"});
}
function activateMain(which){
 try{
  const doc=frame.contentDocument;if(!doc)return;
  cleanOldExpressionCards(doc);
  const target=doc.getElementById(which==="games"?"gamesTab":"practiceTab");
  if(target)target.click();
 }catch(e){}
}
function getCurrentSubject(){
 try{
  const doc=frame.contentDocument;if(!doc)return null;
  if(mode==="expressions"){
    const write=doc.getElementById("write");
    const text=write&&!write.classList.contains("hidden")?doc.getElementById("wWord")?.textContent:doc.getElementById("rWord")?.textContent;
    const value=(text||"").trim();return value?{type:"expression",text:value}:null;
  }
  if(mode==="radicals"){
    const value=(doc.getElementById("glyph")?.textContent||"").trim();return value?{type:"radical",text:value}:null;
  }
  if(mode==="learn"){
    const value=(doc.getElementById("bigchar")?.textContent||"").trim();return value?{type:"character",text:value}:null;
  }
 }catch(e){}
 return null;
}
function updateMemoryButton(){
 const s=getCurrentSubject(),key=s?s.type+"|"+s.text:"";
 if(key===lastSubject&&currentCard===cards.get(key))return;
 lastSubject=key;currentCard=cards.get(key)||null;
 if(currentCard){memoryBtn.textContent="🧠 Memory Palace for "+s.text;memoryBar.style.display="block"}else memoryBar.style.display="none";
}
memoryBtn.onclick=()=>{
 if(!currentCard)return;
 document.getElementById("memoryTitle").textContent=currentCard.title||("Memory Palace · "+currentCard.subject_text);
 document.getElementById("memoryImage").src=STORAGE_BASE+currentCard.storage_path.split("/").map(encodeURIComponent).join("/");
 document.getElementById("memoryNote").textContent=currentCard.note||"";
 memoryDialog.showModal();
};
document.getElementById("memoryClose").onclick=()=>memoryDialog.close();
memoryDialog.addEventListener("click",e=>{if(e.target===memoryDialog)memoryDialog.close()});
frame.addEventListener("load",()=>{if(mode==="learn"||mode==="games")activateMain(mode);setTimeout(updateMemoryButton,150)});
buttons.forEach(b=>b.addEventListener("click",()=>select(b.id)));
setInterval(updateMemoryButton,600);
loadCards();
</script>
</body>
</html>
