<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandarin Learning</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#111827}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;padding-bottom:72px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb;position:fixed;left:0;right:0;bottom:0;z-index:50}
button{min-height:44px;border:1px solid #d0d5dd;border-radius:13px;background:#fff;color:#111827;font:600 15px/1.1 system-ui;padding:8px;cursor:pointer}
nav button{border:0;border-radius:10px;background:#fff;font-size:12px;padding:5px 2px}nav button[aria-selected="true"]{background:#eef6ff;color:#1473e6;border:0}
#memoryBar{display:none;padding:7px 10px;background:#fff7ed;border-bottom:1px solid #fed7aa;text-align:center}
#photoBar{height:56px;padding:7px 12px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:flex-end;gap:8px}#photoBtn{width:46px;min-width:46px;height:42px;min-height:42px;padding:0;font-size:0;border:0;background:#f2f4f7}#photoBtn:after{content:"📷";font-size:23px}
#photoStatus{font-size:13px;color:#475467;max-width:calc(100% - 58px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cameraPanel{display:none;position:fixed;inset:0;z-index:100;background:#000;color:#fff}
#cameraPanel.open{display:flex;flex-direction:column}
#cameraStage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#cameraVideo{width:100%;height:100%;object-fit:cover;display:block}
#cameraShade{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,.24)}
#focusBox{position:absolute;left:50%;top:48%;width:min(68vw,390px);height:min(30vw,180px);transform:translate(-50%,-50%);border:4px solid #16e016;border-radius:5px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);touch-action:none}
#focusBox:before{content:"";position:absolute;left:50%;top:50%;width:28px;height:4px;background:#16e016;transform:translate(-50%,-50%)}
#focusBox:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:28px;background:#16e016;transform:translate(-50%,-50%)}
#cameraHint{text-align:center;padding:9px 12px;background:#111;font-size:14px}
#cameraControls{display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;background:#111}
#cameraControls button{min-width:110px}
#cameraCapture{background:#fff;border:5px solid #aaa;border-radius:50%;min-width:66px;width:66px;height:66px;padding:0;font-size:0}
#cameraCanvas{display:none}
#photoPicker{display:none;padding:10px;background:#eef6ff;border-bottom:1px solid #bfdbfe}
#photoPicker.open{display:block}
#photoChoices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photoChoice{min-height:42px;font-size:22px;padding:7px 12px}
.photoChoice.phrase{font-size:18px}
#photoManual{width:100%;margin-top:10px;padding:10px;border:1px solid #98a2b3;border-radius:10px;font-size:20px}
.photoActions{display:flex;gap:8px;margin-top:8px}.photoActions button{min-height:42px;padding:7px 12px}
#memoryBtn{min-height:40px;background:#fff;border-color:#fdba74;font-size:14px}
iframe{border:0;width:100%;flex:1;min-height:calc(100vh - 128px);background:#fff}
dialog{border:0;border-radius:18px;padding:0;max-width:min(94vw,720px);width:720px;box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0009}
.memoryHead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e7eb}
.memoryHead strong{font-size:22px}.close{min-height:38px;padding:6px 10px}
.memoryBody{padding:12px;text-align:center}.memoryBody img{display:block;max-width:100%;max-height:72vh;margin:auto;border-radius:12px}.memoryNote{margin-top:9px;color:#667085}
@media(max-width:520px){
 body{padding-bottom:70px}
 nav{gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
 nav button{font-size:11px;min-height:52px;white-space:normal}
 #photoBar{height:52px;padding:5px 10px}
 #memoryBar{position:fixed;right:64px;top:7px;z-index:40;padding:0;background:transparent;border:0}
 #memoryBtn{font-size:0;width:44px;min-width:44px;height:40px;min-height:40px;padding:0;border:0;background:#f2f4f7}
 #memoryBtn:before{content:"🧠";font-size:21px}
 #photoPicker{position:fixed;left:8px;right:8px;top:62px;z-index:60;border-radius:16px;box-shadow:0 12px 35px #0003;max-height:72vh;overflow:auto}
 iframe{min-height:calc(100vh - 122px)}
 .memoryHead strong{font-size:18px}
}
</style>
</head>
<body>
<nav role="tablist" aria-label="Mandarin learning sections">
<button id="learn" role="tab" aria-selected="true">✍ Characters</button>
<button id="radicals" role="tab" aria-selected="false">部 Radicals</button>
<button id="expressions" role="tab" aria-selected="false">💬 Expressions</button>
<button id="games" role="tab" aria-selected="false">🎮 Games</button>
</nav>
<div id="photoBar"><button id="photoBtn" type="button">📷 Add from photo</button><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><span id="photoStatus"></span></div>
<div id="cameraPanel" aria-hidden="true">
 <div id="cameraStage">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div id="cameraShade"></div>
  <div id="focusBox" aria-label="Recognition area"></div>
 </div>
 <div id="cameraHint">Move the Chinese character or short phrase inside the green box. Tap inside the box to refocus.</div>
 <div id="cameraControls"><button id="cameraCancel" type="button">Cancel</button><button id="cameraCapture" type="button" aria-label="Take picture">Take picture</button></div>
 <canvas id="cameraCanvas"></canvas>
</div>
<div id="photoPicker">
 <strong>Tap exactly what you want to add</strong>
 <div id="photoChoices"></div>
 <input id="photoManual" type="text" inputmode="text" placeholder="Or edit / paste the Chinese you want">
 <div class="photoActions"><button id="photoCharacter" type="button">Add as Character</button><button id="photoExpression" type="button">Add as Expression</button><button id="photoCancel" type="button">Cancel</button></div>
</div>
<div id="memoryBar"><button id="memoryBtn">🧠 Memory Palace</button></div>
<iframe id="app" title="Mandarin learning app" src="../index.html"></iframe>
<dialog id="memoryDialog">
 <div class="memoryHead"><strong id="memoryTitle">Memory Palace</strong><button id="memoryClose" class="close">✕</button></div>
 <div class="memoryBody"><img id="memoryImage" alt="Memory palace card"><div id="memoryNote" class="memoryNote"></div></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const SUPABASE_URL="https://dbqrenlvinqheyjppxby.supabase.co";
const SUPABASE_KEY="sb_publishable__twdY8fk0pZo7dU-BNDwWg_0-JQ1BjJ";
const STORAGE_BASE=SUPABASE_URL+"/storage/v1/object/public/memory-palace-cards/";
const frame=document.getElementById("app");
const buttons=[...document.querySelectorAll("nav button")];
const memoryBar=document.getElementById("memoryBar");
const memoryBtn=document.getElementById("memoryBtn");
const memoryDialog=document.getElementById("memoryDialog");
const photoBtn=document.getElementById("photoBtn"),photoInput=document.getElementById("photoInput"),photoStatus=document.getElementById("photoStatus");
const cameraPanel=document.getElementById("cameraPanel"),cameraStage=document.getElementById("cameraStage"),cameraVideo=document.getElementById("cameraVideo"),focusBox=document.getElementById("focusBox"),cameraCanvas=document.getElementById("cameraCanvas");
let cameraStream=null;
const photoPicker=document.getElementById("photoPicker"),photoChoices=document.getElementById("photoChoices"),photoManual=document.getElementById("photoManual");
let mode="learn", cards=new Map(), currentCard=null, lastSubject="";

function chineseRuns(raw){
 return (raw.match(/[\u3400-\u9fff]+/g)||[]).filter(Boolean);
}
function photoCandidates(raw){
 const runs=chineseRuns(raw),seen=new Set(),out=[];
 const add=(text,type)=>{text=(text||"").trim();if(text&&!seen.has(text)){seen.add(text);out.push({text,type})}};
 runs.forEach(run=>{
  [...run].forEach(ch=>add(ch,"character"));
  if([...run].length>1)add(run,"phrase");
  for(let n=2;n<=4;n++)for(let i=0;i+n<=[...run].length;i++)add([...run].slice(i,i+n).join(""),"phrase");
 });
 return out.slice(0,80);
}
function showPhotoChoices(raw){
 const items=photoCandidates(raw);
 photoChoices.innerHTML="";
 items.forEach(item=>{
  const b=document.createElement("button");b.type="button";b.className="photoChoice "+item.type;b.textContent=item.text;
  b.onclick=()=>{photoManual.value=item.text;[...photoChoices.children].forEach(x=>x.setAttribute("aria-selected","false"));b.setAttribute("aria-selected","true")};
  photoChoices.appendChild(b);
 });
 photoManual.value="";
 photoPicker.classList.add("open");
 photoStatus.textContent=items.length?"Select the text, then choose Character or Expression.":"I could not find Chinese text. You can type it below.";
}
async function putPhotoText(text,kind){
 text=(text||"").trim();if(!text)return;
 photoPicker.classList.remove("open");
 if(kind==="character"){
  text=[...text][0]||"";
  if(mode!=="learn"){select("learn");await new Promise(r=>setTimeout(r,700))}
  const doc=frame.contentDocument,input=doc&&doc.getElementById("newCharacter");
  if(input){input.value=text;input.dispatchEvent(new Event("input",{bubbles:true}));input.scrollIntoView({behavior:"smooth",block:"center"});photoStatus.textContent="Selected "+text+" — check it, then add it.";return}
 }
 if(kind!=="expression"&&[...text].length===1)return;
 if(mode!=="expressions"){select("expressions");await new Promise(r=>setTimeout(r,700))}
 const doc=frame.contentDocument;
 const input=["newExpression","addWord","word","expression","newWord"].map(id=>doc&&doc.getElementById(id)).filter(Boolean)[0];
 if(input){input.value=text;input.dispatchEvent(new Event("input",{bubbles:true}));input.scrollIntoView({behavior:"smooth",block:"center"});photoStatus.textContent="Selected "+text+" — check it before saving."}
 else photoStatus.textContent="Selected: "+text+". Copy it into the expression form.";
}
async function openCamera(){
 photoPicker.classList.remove("open");photoStatus.textContent="Opening camera…";
 if(!navigator.mediaDevices?.getUserMedia){photoInput.click();return}
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  cameraVideo.srcObject=cameraStream;await cameraVideo.play();
  const track=cameraStream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  const advanced={};
  if(Array.isArray(caps.focusMode)&&caps.focusMode.includes("continuous"))advanced.focusMode="continuous";
  if(Object.keys(advanced).length)try{await track.applyConstraints({advanced:[advanced]})}catch(e){}
  cameraPanel.classList.add("open");cameraPanel.setAttribute("aria-hidden","false");photoStatus.textContent="";
 }catch(e){console.warn(e);photoStatus.textContent="Camera could not open. Choose a photo instead.";photoInput.click()}
}
function closeCamera(){
 cameraPanel.classList.remove("open");cameraPanel.setAttribute("aria-hidden","true");
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
 cameraVideo.srcObject=null;
}
async function refocusCamera(ev){
 if(!cameraStream)return;
 const track=cameraStream.getVideoTracks()[0],caps=track.getCapabilities?track.getCapabilities():{};
 try{
  if(Array.isArray(caps.focusMode)&&caps.focusMode.includes("single-shot"))await track.applyConstraints({advanced:[{focusMode:"single-shot"}]});
  else if(Array.isArray(caps.focusMode)&&caps.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]});
 }catch(e){}
}
focusBox.addEventListener("click",refocusCamera);
document.getElementById("cameraCancel").onclick=closeCamera;
document.getElementById("cameraCapture").onclick=async()=>{
 if(!cameraVideo.videoWidth)return;
 const vr=cameraVideo.getBoundingClientRect(),br=focusBox.getBoundingClientRect();
 const scale=Math.max(vr.width/cameraVideo.videoWidth,vr.height/cameraVideo.videoHeight);
 const shownW=cameraVideo.videoWidth*scale,shownH=cameraVideo.videoHeight*scale;
 const cropLeft=(shownW-vr.width)/2,cropTop=(shownH-vr.height)/2;
 const sx=Math.max(0,(br.left-vr.left+cropLeft)/scale),sy=Math.max(0,(br.top-vr.top+cropTop)/scale);
 const sw=Math.min(cameraVideo.videoWidth-sx,br.width/scale),sh=Math.min(cameraVideo.videoHeight-sy,br.height/scale);
 const upscale=Math.min(3,Math.max(1,1200/sw));
 cameraCanvas.width=Math.round(sw*upscale);cameraCanvas.height=Math.round(sh*upscale);
 const ctx=cameraCanvas.getContext("2d");
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
 ctx.drawImage(cameraVideo,sx,sy,sw,sh,0,0,cameraCanvas.width,cameraCanvas.height);
 closeCamera();photoStatus.textContent="Reading the green box…";
 try{
  const blob=await new Promise(r=>cameraCanvas.toBlob(r,"image/jpeg",.95));
  const result=await Tesseract.recognize(blob,"chi_sim+eng");
  showPhotoChoices((result.data.text||"").trim());
 }catch(e){console.warn(e);photoStatus.textContent="Photo reading failed. Try again with the character filling the green box."}
};
photoBtn.onclick=openCamera;
photoInput.onchange=async()=>{
 const file=photoInput.files&&photoInput.files[0];if(!file)return;
 photoStatus.textContent="Reading photo…";photoPicker.classList.remove("open");
 try{const result=await Tesseract.recognize(file,"chi_sim+eng");showPhotoChoices((result.data.text||"").trim())}
 catch(e){console.warn(e);photoStatus.textContent="Photo reading failed. Please try a clearer picture."}
 finally{photoInput.value=""}
};
document.getElementById("photoCharacter").onclick=()=>putPhotoText(photoManual.value,"character");
document.getElementById("photoExpression").onclick=()=>putPhotoText(photoManual.value,"expression");
document.getElementById("photoCancel").onclick=()=>{photoPicker.classList.remove("open");photoStatus.textContent=""};

async function loadCards(){
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/memory_palace_cards?select=subject_type,subject_text,storage_path,title,note",{headers:{apikey:SUPABASE_KEY}});
  if(!r.ok) throw new Error("Unable to load cards");
  const rows=await r.json();
  cards=new Map(rows.map(x=>[x.subject_type+"|"+x.subject_text,x]));
  updateMemoryButton();
 }catch(e){console.warn(e)}
}
function pageFor(which){
 if(which==="expressions")return "../expressions/";
 if(which==="radicals")return "../radicals-60/";
 return "../index.html";
}
function select(which){
 mode=which;
 buttons.forEach(b=>b.setAttribute("aria-selected",String(b.id===which)));
 const wanted=pageFor(which);
 const current=new URL(frame.src,location.href);
 const target=new URL(wanted,location.href);
 if(current.pathname!==target.pathname) frame.src=wanted;
 else if(which==="learn"||which==="games") activateMain(which);
 memoryBar.style.display="none";
 setTimeout(updateMemoryButton,100);
}
function applyMobileMainUI(doc){
 try{
  if(doc.getElementById("mandarinMobilePatch"))return;
  const style=doc.createElement("style");style.id="mandarinMobilePatch";style.textContent=`
  @media(max-width:700px){
   body{margin:0!important;padding:10px 12px 30px!important;max-width:none!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
   #practiceTab,#gamesTab,#expressionsTab,.tabs,.tabbar,.top-tabs,[role="tablist"]{display:none!important}
   form:has(#newCharacter),#newCharacterForm,.add-character,.character-form{display:none!important}
   #bigchar{font-size:clamp(112px,34vw,170px)!important;line-height:1!important;margin:4px 0!important;display:block!important;overflow:visible!important}
   #pinyin{font-size:34px!important;line-height:1.15!important}
   #meaning{font-size:22px!important}
   button,input,select{min-height:44px!important}
   canvas{max-width:100%!important}
   .container,.card,.panel,main,section{max-width:100%!important}
  }`;
  doc.head.appendChild(style);
  const add=doc.getElementById("newCharacter");
  if(add){
   const form=add.closest("form")||add.parentElement;
   if(form){form.style.display="none";const toggle=doc.createElement("button");toggle.type="button";toggle.textContent="＋ Add character";toggle.style.cssText="margin:4px 0 10px;min-height:42px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:8px 12px;font-weight:700";toggle.onclick=()=>{form.style.display=form.style.display==="none"?"block":"none"};form.parentElement.insertBefore(toggle,form)}
  }
 }catch(e){console.warn(e)}
}
function cleanOldExpressionCards(doc){
 ["old-expressions-heading","lesson-expressions-heading"].forEach(id=>{const h=doc.getElementById(id);if(h&&h.parentElement)h.parentElement.style.display="none"});
}
function activateMain(which){
 try{
  const doc=frame.contentDocument;if(!doc)return;
  cleanOldExpressionCards(doc);
  const target=doc.getElementById(which==="games"?"gamesTab":"practiceTab");
  if(target)target.click();
 }catch(e){}
}
function getCurrentSubject(){
 try{
  const doc=frame.contentDocument;if(!doc)return null;
  if(mode==="expressions"){
    const write=doc.getElementById("write");
    const text=write&&!write.classList.contains("hidden")?doc.getElementById("wWord")?.textContent:doc.getElementById("rWord")?.textContent;
    const value=(text||"").trim();return value?{type:"expression",text:value}:null;
  }
  if(mode==="radicals"){
    const value=(doc.getElementById("glyph")?.textContent||"").trim();return value?{type:"radical",text:value}:null;
  }
  if(mode==="learn"){
    const value=(doc.getElementById("bigchar")?.textContent||"").trim();return value?{type:"character",text:value}:null;
  }
 }catch(e){}
 return null;
}
function updateMemoryButton(){
 const s=getCurrentSubject(),key=s?s.type+"|"+s.text:"";
 if(key===lastSubject&&currentCard===cards.get(key))return;
 lastSubject=key;currentCard=cards.get(key)||null;
 if(currentCard){memoryBtn.textContent="🧠 Memory Palace for "+s.text;memoryBar.style.display="block"}else memoryBar.style.display="none";
}
memoryBtn.onclick=()=>{
 if(!currentCard)return;
 document.getElementById("memoryTitle").textContent=currentCard.title||("Memory Palace · "+currentCard.subject_text);
 document.getElementById("memoryImage").src=STORAGE_BASE+currentCard.storage_path.split("/").map(encodeURIComponent).join("/");
 document.getElementById("memoryNote").textContent=currentCard.note||"";
 memoryDialog.showModal();
};
document.getElementById("memoryClose").onclick=()=>memoryDialog.close();
memoryDialog.addEventListener("click",e=>{if(e.target===memoryDialog)memoryDialog.close()});
frame.addEventListener("load",()=>{if(mode==="learn"||mode==="games"){activateMain(mode);applyMobileMainUI(frame.contentDocument)}setTimeout(updateMemoryButton,150)});
buttons.forEach(b=>b.addEventListener("click",()=>select(b.id)));
setInterval(updateMemoryButton,600);
loadCards();
</script>
</body>
</html>
